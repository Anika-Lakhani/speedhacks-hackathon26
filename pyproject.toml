[project]
name = "swarmshield"
version = "0.1.0"
description = "SwarmShield MVP: demo sites, event store, attack simulation and shared intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=2.29.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "keewano", "sites", "attack", "distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
