<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmShield · live demo</title><link rel="stylesheet" href="/static/style.css">
<style>
  main{max-width:900px}
  .hero{text-align:center;padding:26px 18px 10px}
  .hero h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  .big{font-size:18px;padding:14px 28px;border-radius:10px;font-weight:600}
  .big:disabled{opacity:.55}
  .chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--card)}
  .steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}
  .step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
  .step.active{color:var(--fg);border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
  .step.done{color:var(--green);border-color:var(--green)}
  .dot{width:9px;height:9px;border-radius:99px;background:currentColor;opacity:.5}
  .step.active .dot{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.2}}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .section-title .note{text-transform:none;letter-spacing:0}
  .finding{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px;margin-bottom:12px;background:var(--card)}
  .finding.fixed{border-left-color:var(--green)}
  .finding h3{margin:0 0 4px;font-size:17px}
  .finding .why{color:var(--muted);margin:4px 0 12px}
  .patch{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;margin:10px 0}
  .patch .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
  .sev{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff;vertical-align:2px}
  .sev.critical{background:#b91c1c}.sev.high{background:var(--red)}.sev.medium{background:var(--amber)}.sev.low{background:var(--grey)}
  .allclear{text-align:center;padding:22px;border:1px solid var(--green);border-radius:10px;background:color-mix(in srgb,var(--green) 8%,var(--card));color:var(--green);font-weight:600}
  .ok{color:var(--green);font-weight:600}
  .toast{text-align:center;color:var(--muted);min-height:20px;margin-top:10px}
  .mdcard{border:1px solid var(--line);border-radius:10px;padding:4px 18px;background:var(--card)}
  .mdcard.shared{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--card)),var(--card))}
  .mdcard.flash{animation:flash 1.4s ease}
  @keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 40%,transparent)}100%{box-shadow:none}}
  .md h1{font-size:19px}.md h2{font-size:15px;margin-top:14px}.md h3{font-size:14px}
  .md table{font-size:13px}.md{line-height:1.55}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body>
<header><a href="/">← All customers</a><h1>SwarmShield</h1><span id="meta" class="muted"></span></header>
<main>
  <div class="hero">
    <h1 id="title">customer-a</h1>
    <p class="sub"><span id="apptype" class="chip"></span> &nbsp; <span id="rev" class="chip"></span></p>
    <button id="run" class="big">▶&nbsp; Run security scan</button>
    <div class="steps" id="steps" hidden>
      <div class="step" data-s="plan"><span class="dot"></span>Analyzing &amp; planning</div>
      <div class="step" data-s="attack"><span class="dot"></span>Attacking (safely)</div>
      <div class="step" data-s="verify"><span class="dot"></span>Verifying findings</div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div id="results" hidden>
    <div class="section-title">What the agents found</div>
    <div id="findings"></div>
  </div>

  <div class="section-title">Customer memory
    <span class="note muted">— <code>customer-a.md</code>, written live from the event stream</span></div>
  <div class="mdcard md" id="memory"></div>

  <div class="section-title">Shared intelligence
    <span id="kv" class="chip"></span>
    <span class="note muted">— <code>shared-intelligence.md</code>, the layer that learns across every customer</span></div>
  <div class="mdcard shared md" id="sharedmd"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script type="module">
import { el, api, post, renderMarkdown } from "/static/common.js";
const id = location.pathname.split("/").pop(), base = `/api/customer/${id}`;
const $ = x => document.getElementById(x);
const sleep = ms => new Promise(r => setTimeout(r, ms));
$("title").textContent = id;
document.title = `${id} · SwarmShield`;

const FRIENDLY = {
  "SCN-IDOR-001": { name: "Customers can read other customers' orders",
    why: "The order page trusts an ID from the URL without checking who owns it, so one shopper can open someone else's order." },
  "SCN-RATE-001": { name: "Login has no rate limiting",
    why: "Failed logins aren't throttled, so an attacker can guess passwords as fast as they like." },
  "SCN-RATE-002": { name: "One-time-code check has no rate limiting",
    why: "Verification codes can be brute-forced because guesses aren't limited." },
  "SCN-RESET-001": { name: "Password reset accepts a guessable token",
    why: "The reset flow accepts weak tokens, letting an attacker take over an account." },
};

let busy = false;
const setBusy = b => { busy = b; $("run").disabled = b; };
const toast = (t, spin=false) => { $("toast").replaceChildren(); if (spin) $("toast").append(el("span",{class:"spin"})," "); if (t) $("toast").append(document.createTextNode(t)); };

const ORDER = ["plan","attack","verify"];
const STAGE_TO_STEP = { planning: "plan", probing: "attack", done: "verify", error: "verify" };
function setStep(key, status) {
  for (const s of document.querySelectorAll(".step")) {
    const si = ORDER.indexOf(s.dataset.s), ki = ORDER.indexOf(key);
    s.classList.toggle("active", s.dataset.s === key && status !== "done");
    s.classList.toggle("done", si < ki || status === "done");
  }
}

// ---- run flow (mechanics abstracted away: offline + auto-approve, one click) ----
$("run").onclick = doRun;
async function doRun() {
  if (busy) return;
  setBusy(true); $("steps").hidden = false; setStep("plan"); toast("Starting the swarm…", true);
  try {
    const { run_id } = await post(`${base}/run`, { offline: true, auto_approve: true,
      objective: "Test recently changed surfaces for regressions" });
    await pollRun(run_id);
  } catch (e) { toast(`Scan failed: ${e.message}`); }
  finally { setBusy(false); }
}
async function pollRun(run_id) {
  for (;;) {
    const st = await api(`/api/run/${run_id}`);
    setStep(STAGE_TO_STEP[st.stage] || "plan");
    if (st.stage === "probing" && st.planned)
      toast(`Running ${st.probed}/${st.planned} attack scenarios against the live app…`, true);
    else if (st.stage === "planning") toast("Reading the app, diff and past findings to plan attacks…", true);
    if (st.status === "done" || st.status === "error") {
      setStep("verify", "done");
      toast(st.status === "error" ? `Error: ${st.error}` : "Scan complete — memory pages updated below.");
      await showResults(true); return;
    }
    await sleep(900);
  }
}

// ---- results ----
async function showResults(flash) {
  $("results").hidden = false;
  const [vulns] = await Promise.all([api(`${base}/vulnerabilities`), loadMeta(), loadMds(flash)]);
  const box = $("findings"); box.replaceChildren();
  if (!vulns.vulnerabilities.length) {
    box.append(el("div", { class: "allclear" }, "✓ No open vulnerabilities — this deploy is clean."));
    return;
  }
  for (const v of vulns.vulnerabilities) box.append(findingCard(v));
}
function findingCard(v) {
  const f = FRIENDLY[v.scenario_id] || { name: v.scenario_id, why: v.invariant || "" };
  const sev = (v.severity || "high").toLowerCase();
  const card = el("div", { class: "finding" },
    el("h3", {}, f.name, " ", el("span", { class: `sev ${sev}` }, sev)),
    el("div", { class: "why" }, f.why),
    el("div", { class: "patch" },
      el("div", { class: "lbl" }, "Suggested patch"),
      el("div", {}, "Enforce ownership/authorization on this endpoint. SwarmShield will disable the ",
        el("code", {}, v.flag || "weakness"), " weakness, redeploy, and re-verify automatically.")),
    el("div", {}, el("button", { onclick: () => fix(v, card) }, "✓ Approve & apply fix")));
  return card;
}
async function fix(v, card) {
  if (busy) return;
  setBusy(true);
  const btn = card.querySelector("button"); btn.disabled = true; btn.textContent = "Applying & re-verifying…";
  try {
    const r = await post(`${base}/fix`, { scenario_id: v.scenario_id });
    if (r.fixed) {
      card.classList.add("fixed");
      card.querySelector(".patch").replaceChildren(
        el("div", { class: "lbl" }, "Applied & verified"),
        el("div", {}, "Disabled ", el("code", {}, r.flag), " and redeployed as ", el("code", {}, r.code_revision),
          ". Re-attack verdict: ", el("span", { class: "ok" }, "not reproduced ✓")));
      btn.remove();
      const sevEl = card.querySelector("h3 .sev");
      if (sevEl) sevEl.replaceWith(el("span", { class: "sev low" }, "fixed"));
      toast("Fixed and verified. Lesson shared to the intelligence layer below.");
    } else {
      btn.disabled = false; btn.textContent = "✓ Approve & apply fix";
      toast(`Fix did not hold (verdict: ${r.verdict}).`);
    }
    await Promise.all([loadMeta(), loadMds(true)]);
  } catch (e) { toast(`Fix failed: ${e.message}`); btn.disabled = false; btn.textContent = "✓ Approve & apply fix"; }
  finally { setBusy(false); }
}

// ---- the markdown pages, front and center ----
async function loadMeta() {
  const f = await api(`${base}/flags`);
  $("rev").textContent = `revision ${f.code_revision ?? "n/a"}`;
}
let lastShared = null;
async function loadMds(flash) {
  const [m, s] = await Promise.all([api(`${base}/memory`), api(`/api/shared`)]);
  renderMarkdown($("memory"), m.markdown || "_empty_");
  renderMarkdown($("sharedmd"), s.markdown || "_empty_");
  const kv = (s.markdown.match(/knowledge_version[^0-9]*([0-9.]+)/i) || [])[1];
  $("kv").textContent = kv ? `v${kv}` : "";
  if (flash && s.markdown !== lastShared) {
    $("sharedmd").classList.remove("flash"); void $("sharedmd").offsetWidth; $("sharedmd").classList.add("flash");
  }
  lastShared = s.markdown;
}

// ---- init ----
(async () => {
  const cs = await api("/api/customers").catch(() => []);
  const me = cs.find(c => c.customer_id === id);
  $("apptype").textContent = me?.app_type || "customer";
  await Promise.all([loadMeta(), loadMds(false)]);
})();
</script></body></html>
